services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # С postgres:18 PGDATA лежит в /var/lib/postgresql/<major>/docker,
      # поэтому volume монтируется в /var/lib/postgresql, а не в .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
